services:
  shopware:
    build:
      context: ${XO_ROOT_DIR}
      dockerfile: docker/shopware/Dockerfile
      target: dev
      args:
        BASE_ECR_REGISTRY: ${BASE_ECR_REGISTRY}
    container_name: ${XO_PROJECT_NAME}-shopware
    ports:
      - "${XO_SHOPWARE_HTTP_PORT}:80"
    environment:
      APP_ENV: dev
      # Öffentliche Basis-URL — hinter dem proxy-Bundle z. B.
      # https://<XO_SERVER_NAME><XO_SHOP_PATH_PREFIX>
      APP_URL: ${XO_SHOPWARE_APP_URL}
      APP_SECRET: dev-secret-not-for-production-0123456789abcdef0123456789abcdef
      DATABASE_URL: mysql://root:root@shopware-db:3306/shopware
      MAILER_DSN: smtp://shopware-mail:1025
      SHOPWARE_SKIP_WEBINSTALLER: 1
      # REMOTE_ADDR = dem direkten Peer (Proxy-Container) vertrauen; leer =
      # kein Proxy-Vertrauen (Standalone-Betrieb ohne proxy-Bundle)
      TRUSTED_PROXIES: ${XO_SHOPWARE_TRUSTED_PROXIES}
      XDEBUG_MODE: ${XO_SHOPWARE_XDEBUG_MODE}
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ${XO_ROOT_DIR}/app:/app:rw
      - ${XO_ROOT_DIR}/custom/plugins:/app/custom/plugins:rw
      - ${XO_ROOT_DIR}/custom/apps:/app/custom/apps:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      shopware-db:
        condition: service_healthy
    tty: true
    healthcheck:
      # Pfad konfigurierbar: hinter dem Proxy matcht "/" keinen Sales
      # Channel mehr (Domain zeigt auf den Präfix) — dann /admin verwenden.
      test: ["CMD", "curl", "-f", "http://localhost${XO_SHOPWARE_HEALTHCHECK_PATH}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  shopware-db:
    image: mysql:8.4
    container_name: ${XO_PROJECT_NAME}-shopware-db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${XO_SHOPWARE_DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopware
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  shopware-mail:
    image: axllent/mailpit:latest
    container_name: ${XO_PROJECT_NAME}-shopware-mail
    ports:
      - "${XO_SHOPWARE_MAIL_PORT}:8025"

networks:
  default:
    external: true
    name: ${XO_PROJECT_NAME}
