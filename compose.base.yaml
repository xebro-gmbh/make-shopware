services:
  shopware:
    # No local image build (raffl pattern): the dev image is built globally
    # by the base-image-shopware repo and pushed to the root-account ECR.
    # The app subrepo only ships the Dockerfile for the final prod image.
    image: ${BASE_ECR_REGISTRY}/base/shopware:${XO_SHOPWARE_BASE_DEV_TAG:-base-dev}
    container_name: ${XO_PROJECT_NAME}-shopware
    ports:
      - "${XO_SHOPWARE_HTTP_PORT}:80"
    environment:
      APP_ENV: dev
      # public base URL — behind the proxy bundle e.g.
      # https://<XO_SERVER_NAME><XO_SHOP_PATH_PREFIX>
      APP_URL: ${XO_SHOPWARE_APP_URL}
      APP_SECRET: dev-secret-not-for-production-0123456789abcdef0123456789abcdef
      DATABASE_URL: mysql://root:root@shopware-db:3306/shopware
      MAILER_DSN: smtp://shopware-mail:1025
      SHOPWARE_SKIP_WEBINSTALLER: 1
      # REMOTE_ADDR = trust the direct peer (proxy container); empty = no
      # proxy trust (standalone operation without the proxy bundle)
      TRUSTED_PROXIES: ${XO_SHOPWARE_TRUSTED_PROXIES}
      XDEBUG_MODE: ${XO_SHOPWARE_XDEBUG_MODE}
      COMPOSER_HOME: /tmp/composer
    volumes:
      # XO_SHOPWARE_PROJECT_DIR: where the shop code lives relative to the
      # project root ("." = root, "shop" = subrepo layout)
      - ${XO_ROOT_DIR}/${XO_SHOPWARE_PROJECT_DIR:-.}/app:/app:rw
      - ${XO_ROOT_DIR}/${XO_SHOPWARE_PROJECT_DIR:-.}/custom/plugins:/app/custom/plugins:rw
      - ${XO_ROOT_DIR}/${XO_SHOPWARE_PROJECT_DIR:-.}/custom/apps:/app/custom/apps:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      shopware-db:
        condition: service_healthy
    tty: true
    healthcheck:
      # path is configurable: behind the proxy "/" no longer matches a
      # sales channel (domain points at the prefix) — use /admin then.
      test: ["CMD", "curl", "-f", "http://localhost${XO_SHOPWARE_HEALTHCHECK_PATH}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  shopware-db:
    image: mysql:8.4
    container_name: ${XO_PROJECT_NAME}-shopware-db
    # note: --default-authentication-plugin was removed in MySQL 8.4; the
    # default caching_sha2_password works fine with PHP's mysqlnd.
    ports:
      - "${XO_SHOPWARE_DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopware
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  shopware-mail:
    image: axllent/mailpit:latest
    container_name: ${XO_PROJECT_NAME}-shopware-mail
    ports:
      - "${XO_SHOPWARE_MAIL_PORT}:8025"

networks:
  default:
    external: true
    name: ${XO_PROJECT_NAME}
